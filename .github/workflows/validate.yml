name: Validate

on:
  pull_request:
  push:
    branches: [main, master, 001-cosmic-horror-refactor]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    strategy:
      fail-fast: false
      matrix:
        # Integration stays local until the maintainer restores its hosted gate.
        include:
          - check: unit
            command: npm run test:unit
          - check: browser
            command: npm run test:browser
          - check: lint
            command: npm run lint
          - check: format
            command: npm run format:check
          - check: audit
            command: npm audit --audit-level=high
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Unit tests compare the frozen source bytes to the original Git blobs.
          fetch-depth: ${{ matrix.check == 'unit' && '0' || '1' }}
      - name: Prepare container ownership for Git and Firefox
        run: |
          # Firefox refuses a home directory owned by another container user.
          chown "$(id -u):$(id -g)" "$HOME"
          # Checkout's temporary Git config is not used by later shell steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Select npm and record runtime
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          mkdir -p ci-reports
          { node --version; npm --version; cat /etc/os-release; uname -m; } > ci-reports/environment.txt
      - name: Clean install without lifecycle scripts
        run: npm ci 2>&1 | tee ci-reports/install.txt
      - name: Install unit test system dependencies
        if: matrix.check == 'unit'
        run: |
          # Makefile regression tests launch GNU Make inside the Playwright container.
          apt-get update
          apt-get install -y --no-install-recommends make
          make --version
      - name: Install matching engines
        if: matrix.check == 'browser'
        run: npx playwright install --with-deps chromium firefox webkit 2>&1 | tee ci-reports/engines.txt
      - name: Run required check
        run: ${{ matrix.command }} 2>&1 | tee ci-reports/${{ matrix.check }}.txt
      - name: Retain reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.check }}
          path: |
            ci-reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
