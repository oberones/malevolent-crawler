server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /srv/malevolent-crawler;
    autoindex off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    # Runtime filenames are stable across releases and must be revalidated.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /LICENSE {
        default_type text/plain;
        try_files $uri =404;
    }

    # Explicitly map both module and classic scripts, regardless of upstream MIME defaults.
    location ~ ^/assets/.*\.(js|mjs)$ {
        types { application/javascript js mjs; }
        try_files $uri =404;
    }

    # No directory redirects, listing, dotfiles or app-shell fallback.
    location ~ /\. { return 404; }
    location ~ /$ { return 404; }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
